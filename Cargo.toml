[workspace]
resolver = "3"
members = [
    "crates/pkg2zip-core",
    "crates/pkg2zip-cli",
    "crates/pkg2zip-testkit",
]

[workspace.package]
version = "3.0.1"
edition = "2024"
rust-version = "1.89"
license = "Unlicense"
repository = "https://github.com/allyssonmoscoso/pkg2zip-rust-implementation"
authors = ["Allysson Moscoso"]

[workspace.dependencies]
aes = "=0.9.4"
cipher = "=0.5.2"
ctr = "=0.10.1"
thiserror = "=2.0.21"
crc32fast = "=1.5.5"
cmac = "=0.8.0"
miniz_oxide = "=0.9.1"
flate2 = "=1.1.11"

sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
walkdir = "=2.5.0"

pkg2zip-core = { path = "crates/pkg2zip-core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
