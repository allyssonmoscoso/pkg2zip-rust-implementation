name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  no-c:
    name: no C toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: El árbol de dependencias no compila C
        run: |
          set -euo pipefail
          deps="$(cargo tree --workspace -e normal,build --prefix none | sort -u)"
          echo "$deps"
          # `cc`/`cmake`/`bindgen` son los mecanismos con los que un build.rs compila C.
          offenders="$(echo "$deps" | grep -E '^(cc|cmake|bindgen) v' || true)"
          # Crates -sys que no compilan C (binding puros de Rust).
          sys_crates="$(echo "$deps" | grep -E -- '-sys v' \
            | grep -vE '^(windows-sys|windows-link|linux-raw-sys) v' || true)"
          if [ -n "$offenders$sys_crates" ]; then
            echo "::error::Dependencias que pueden compilar C:"
            echo "$offenders"
            echo "$sys_crates"
            exit 1
          fi
      - name: Los crates del producto no contienen C
        run: |
          set -euo pipefail
          if find crates -type f \( -name '*.c' -o -name '*.h' \) | grep -q .; then
            echo "::error::Se encontraron fuentes C en crates/"
            exit 1
          fi

  parity:
    name: parity (C vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar el binario C de referencia
        run: ./scripts/build-legacy.sh "$PWD/target/legacy"
      - name: Generar corpus sintético
        run: cargo run -q -p pkg2zip-testkit -- gen target/corpus
      - name: Compilar el binario Rust
        run: cargo build --locked
      - name: Ejecutar arnés de paridad
        run: |
          cargo run -q -p pkg2zip-testkit -- parity \
            --corpus target/corpus \
            --legacy target/legacy/pkg2zip \
            --rust target/debug/pkg2zip \
            --report target/parity.json
      - name: Publicar reporte de paridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: target/parity.json
          if-no-files-found: ignore
